<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="992" viewBox="0 0 1520 992" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" fill="#E6EDF3" role="img" aria-label="추천 요청 흐름 (202 + job_id → Redis Streams)"><title>추천 요청 흐름 (202 + job_id → Redis Streams)</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8B949E"/></marker></defs><rect width="100%" height="100%" fill="#0D1117"/><line x1="185.0" y1="64" x2="185.0" y2="982" stroke="#6E7681" stroke-dasharray="3 5"/><rect x="84.0" y="12" width="202" height="46" rx="6" fill="#0C2D6B" stroke="#58A6FF"/><text x="185.0" y="34" text-anchor="middle" font-weight="700">BFF</text><text x="185.0" y="52" text-anchor="middle" font-size="11">map-project-user</text><line x1="415.0" y1="64" x2="415.0" y2="982" stroke="#6E7681" stroke-dasharray="3 5"/><rect x="314.0" y="12" width="202" height="46" rx="6" fill="#0C2D6B" stroke="#58A6FF"/><text x="415.0" y="34" text-anchor="middle" font-weight="700">agent API</text><text x="415.0" y="52" text-anchor="middle" font-size="11">FastAPI</text><line x1="645.0" y1="64" x2="645.0" y2="982" stroke="#6E7681" stroke-dasharray="3 5"/><rect x="544.0" y="12" width="202" height="46" rx="6" fill="#0C2D6B" stroke="#58A6FF"/><text x="645.0" y="34" text-anchor="middle" font-weight="700">LangGraph</text><text x="645.0" y="52" text-anchor="middle" font-size="11">백그라운드 잡</text><line x1="875.0" y1="64" x2="875.0" y2="982" stroke="#6E7681" stroke-dasharray="3 5"/><rect x="774.0" y="12" width="202" height="46" rx="6" fill="#0C2D6B" stroke="#58A6FF"/><text x="875.0" y="34" text-anchor="middle" font-weight="700">hub</text><text x="875.0" y="52" text-anchor="middle" font-size="11">map-project-hub</text><line x1="1105.0" y1="64" x2="1105.0" y2="982" stroke="#6E7681" stroke-dasharray="3 5"/><rect x="1004.0" y="12" width="202" height="46" rx="6" fill="#0C2D6B" stroke="#58A6FF"/><text x="1105.0" y="34" text-anchor="middle" font-weight="700">LLM 제공자</text><text x="1105.0" y="52" text-anchor="middle" font-size="11">합성(기본) · Gemini(선택)</text><line x1="1335.0" y1="64" x2="1335.0" y2="982" stroke="#6E7681" stroke-dasharray="3 5"/><rect x="1234.0" y="12" width="202" height="46" rx="6" fill="#0C2D6B" stroke="#58A6FF"/><text x="1335.0" y="34" text-anchor="middle" font-weight="700">Redis Streams</text><text x="1335.0" y="52" text-anchor="middle" font-size="11">DB2</text><rect x="35.0" y="104" width="1450" height="26" rx="4" fill="#161B22" stroke="#30363D"/><text x="45.0" y="122" font-weight="600">① 접수</text><text x="300.0" y="156" text-anchor="middle">POST /v1/recommend</text><text x="300.0" y="174" text-anchor="middle">(X-Internal-Token)</text><line x1="185.0" y1="180" x2="415.0" y2="180" stroke="#8B949E" marker-end="url(#arr)"/><path d="M415.0,202 h28 v22 h-28" fill="none" stroke="#8B949E" marker-end="url(#arr)"/><text x="451.0" y="216">토큰 검증 · job_id 발급 · 잡 시작</text><text x="300.0" y="258" text-anchor="middle">202 Accepted + job_id</text><line x1="415.0" y1="264" x2="185.0" y2="264" stroke="#8B949E" stroke-dasharray="6 4" marker-end="url(#arr)"/><rect x="35.0" y="286" width="1450" height="26" rx="4" fill="#161B22" stroke="#30363D"/><text x="45.0" y="304" font-weight="600">② 실행 (노드마다 진행 이벤트)</text><text x="990.0" y="338" text-anchor="middle">XADD agent:jobs:status (stage)</text><line x1="645.0" y1="344" x2="1335.0" y2="344" stroke="#8B949E" marker-end="url(#arr)"/><text x="760.0" y="378" text-anchor="middle">GET /v1/weather</text><line x1="645.0" y1="384" x2="875.0" y2="384" stroke="#8B949E" marker-end="url(#arr)"/><text x="760.0" y="418" text-anchor="middle">GET /v1/places (테마별)</text><line x1="645.0" y1="424" x2="875.0" y2="424" stroke="#8B949E" marker-end="url(#arr)"/><text x="760.0" y="458" text-anchor="middle">POST 반경 필터 (좌표는 봉투)</text><line x1="645.0" y1="464" x2="875.0" y2="464" stroke="#8B949E" marker-end="url(#arr)"/><text x="760.0" y="498" text-anchor="middle">POST 실내 가점</text><text x="760.0" y="516" text-anchor="middle">(/v1/rules/score/…)</text><line x1="645.0" y1="522" x2="875.0" y2="522" stroke="#8B949E" marker-end="url(#arr)"/><text x="760.0" y="556" text-anchor="middle">GET /v1/reviews (후기 보강을</text><text x="760.0" y="574" text-anchor="middle">켰을 때, 상위 후보만)</text><line x1="645.0" y1="580" x2="875.0" y2="580" stroke="#8B949E" marker-end="url(#arr)"/><text x="875.0" y="614" text-anchor="middle">장소 선정 (구조화 출력)</text><line x1="645.0" y1="620" x2="1105.0" y2="620" stroke="#8B949E" marker-end="url(#arr)"/><text x="760.0" y="654" text-anchor="middle">GET /v1/places (선정 장소</text><text x="760.0" y="672" text-anchor="middle">출처 확인)</text><line x1="645.0" y1="678" x2="875.0" y2="678" stroke="#8B949E" marker-end="url(#arr)"/><path d="M645.0,700 h28 v22 h-28" fill="none" stroke="#8B949E" marker-end="url(#arr)"/><text x="681.0" y="714">방문 순서·구간 계산 (모델 호출 없음)</text><text x="760.0" y="756" text-anchor="middle">POST 체류시간</text><text x="760.0" y="774" text-anchor="middle">(/v1/rules/estimate/…)</text><line x1="645.0" y1="780" x2="875.0" y2="780" stroke="#8B949E" marker-end="url(#arr)"/><text x="875.0" y="814" text-anchor="middle">추천 이유 (실패 시 생략)</text><line x1="645.0" y1="820" x2="1105.0" y2="820" stroke="#8B949E" marker-end="url(#arr)"/><rect x="35.0" y="842" width="1450" height="26" rx="4" fill="#161B22" stroke="#30363D"/><text x="45.0" y="860" font-weight="600">③ 결과</text><text x="990.0" y="894" text-anchor="middle">XADD agent:jobs:done (payload 는 봉투)</text><line x1="645.0" y1="900" x2="1335.0" y2="900" stroke="#8B949E" marker-end="url(#arr)"/><text x="760.0" y="934" text-anchor="middle">컨슈머 그룹으로 결과 읽기</text><line x1="185.0" y1="940" x2="1335.0" y2="940" stroke="#8B949E" marker-end="url(#arr)"/></svg>
